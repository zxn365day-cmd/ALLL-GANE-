<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f7f7f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background-color: #ffffff; width: 100%; max-width: 420px; padding: 30px 20px; border-radius: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .badge { font-size: 11px; font-weight: 700; color: #b8860b; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .badge::before, .badge::after { content: ""; flex: 1; border-bottom: 1px solid #eee; }
    .badge-text { padding: 0 10px; }
    .profile-container { position: relative; width: 110px; height: 110px; margin: 0 auto 20px auto; }
    .profile-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .check-icon { position: absolute; bottom: 2px; right: 2px; background-color: #000; color: #fff; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 2px solid #fff; }
    .title { font-size: 24px; font-weight: 700; color: #111; margin-bottom: 8px; }
    .members { color: #666; font-size: 15px; margin-bottom: 15px; }
    .dot { color: #2e7d32; font-weight: bold; }
    .bio { color: #555; font-size: 14px; margin-bottom: 25px; }
    .divider { border: none; border-top: 1px solid #f0f0f0; margin: 20px 0; }
    .features { display: flex; justify-content: center; gap: 15px; color: #666; font-size: 14px; margin-bottom: 25px; }
    .dot-separator { color: #ccc; }
    .btn-join { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background-color: #12151c; color: #ffffff; padding: 16px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 16px; margin-bottom: 15px; }
    .app-note { font-size: 13px; color: #888; margin-bottom: 12px; }
    .recent-join { font-size: 13px; color: #333; font-weight: 500; }
    .footer { font-size: 11px; color: #a0a0a0; margin-top: 30px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge"><span class="badge-text">✔ VERIFIED CHANNEL</span></div>
    
    <div class="profile-container">
      <img src="https://i.ibb.co/N6fvX2pC/IMG-9364.jpg" alt="Profile" class="profile-img">
      <div class="check-icon">✓</div>
    </div>

    <h1 class="title">KIM ZAYN 📊</h1>
    
    <p class="members">
      <span class="dot">•</span> <span id="member-count">Loading...</span> members
    </p>

    <p class="bio">i lost my 20k TELEGRAM FAMILY 👥😢</p>

    <hr class="divider">

    <div class="features">
      <span>Free to join</span>
      <span class="dot-separator">•</span>
      <span>Instant access</span>
      <span class="dot-separator">•</span>
      <span>Private</span>
    </div>

    <!-- Updated Join Link -->
    <a href="https://t.me/+05qvEdy_Vn8xZGJl" class="btn-join">
      Join Channel <span>▶</span>
    </a>

    <p class="app-note">Opens in the Telegram app</p>
    <p class="recent-join"><strong>201</strong> people joined in the last 24 hours</p>

    <hr class="divider">

    <div class="footer">
      © 2026 KIM ZAYN 📊 • Not affiliated with Telegram
    </div>
  </div>

  <script>
    const BOT_TOKEN = "8447506161:AAEPMruL5fgW7gDxDfKhnrBhcOZuxCeE46s";
    const CHANNEL_USERNAME = "@KIM_ZAYNBOSS";

    async function getRealTelegramMembers() {
      try {
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/getChatMemberCount?chat_id=${CHANNEL_USERNAME}`;
        const response = await fetch(url);
        const data = await response.json();

        if (data.ok) {
          document.getElementById('member-count').innerText = data.result.toLocaleString();
        } else {
          document.getElementById('member-count').innerText = "Live";
        }
      } catch (error) {
        console.error("Error:", error);
        document.getElementById('member-count').innerText = "Live";
      }
    }

    getRealTelegramMembers();
  </script>

</body>
</html>
